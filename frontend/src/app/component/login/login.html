<div class="login-container">
  <div class="login-box">
    <h1>HereNow</h1>
    <form>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          class="form-control"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          placeholder="Enter your username"
          required
        />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          class="form-control"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          placeholder="Enter your password"
          required
        />
      </div>
      <button type="button" class="btn btn-primary w-100 login-btn" routerLink="/map">
        Login
      </button>
      <button type="button" class="btn btn-outline-primary w-100 signup-btn">
        Sign Up
      </button>
    </form>
  </div>
</div>
