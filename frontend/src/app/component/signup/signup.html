<div class="signup-container">
  <div class="signup-box">
    <h1>Create Account</h1>
    <form>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          class="form-control"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button type="button" class="btn btn-primary w-100 signup-btn" routerLink="/">
        Sign Up
      </button>
    </form>
  </div>
</div>
